services:
  postgres:
    image: postgres:16-alpine
    container_name: minecraft-skin-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-skin_server}
    ports:
      - "5432:5432"
    # 建表由应用启动时的 SetupService / migrate 自动完成，不挂载 001 初始化脚本
    # （否则只建到 001 旧 schema，缺 012/013 等）。
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skin-dev-network

  redis:
    image: redis:7-alpine
    container_name: minecraft-skin-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - skin-dev-network

  backend:
    image: node:20-alpine
    container_name: minecraft-skin-backend-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-}
      - DB_DATABASE=${DB_DATABASE:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_URL=http://localhost:3000
      - JWT_SECRET=development-secret-key
      - RSA_PRIVATE_KEY_PATH=/app/keys/private.pem
      - RSA_PUBLIC_KEY_PATH=/app/keys/public.pem
      - UPLOAD_DIR=/app/uploads
      # 网络代理：默认不设置；如需通过宿主机代理访问外网，
      # 在 shell 或 .env 中导出 HTTP_PROXY / HTTPS_PROXY 即可（例如本地代理端口）。
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,backend,frontend,postgres,redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/frontend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm install && npm run generate-keys && npm run migrate && npm run dev"
    networks:
      - skin-dev-network

  frontend:
    image: node:20-alpine
    container_name: minecraft-skin-frontend-dev
    working_dir: /app/frontend
    ports:
      - "5174:5174"
    environment:
      - VITE_PROXY_TARGET=http://backend:3000
      # Vite 在挂载卷上的 HMR 依赖文件轮询，默认开启以确保改动被检测到。
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      # 网络代理：默认不设置（见 backend 说明）。
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,backend,frontend,postgres,redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/frontend/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - skin-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  skin-dev-network:
    driver: bridge
