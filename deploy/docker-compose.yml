services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: minecraft-skin-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      # 数据库
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-skin_server}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_PATH=${DB_PATH:-/app/data/skin_server.db}
      # 缓存
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # 站点 / 鉴权
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:?必须设置一个强随机 JWT_SECRET}
      - RSA_PRIVATE_KEY_PATH=/app/keys/private.pem
      - RSA_PUBLIC_KEY_PATH=/app/keys/public.pem
      - UPLOAD_DIR=/app/uploads
      - ONE_PANEL_MODE=${ONE_PANEL_MODE:-false}
      # OAuth（Microsoft，可选；留空则不启用第三方登录）
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - OAUTH_CALLBACK_BASE_URL=${OAUTH_CALLBACK_BASE_URL:-}
      # 对象存储（可选；STORAGE_TYPE=s3 时生效）
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      # 人机验证（可选；留空则用内置算术验证码）
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_EXPECTED_HOSTNAME=${TURNSTILE_EXPECTED_HOSTNAME:-}
      # API 文档（生产建议关闭）
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../uploads:/app/uploads
      - ../keys:/app/keys
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    networks:
      - skin-network

  postgres:
    image: postgres:16-alpine
    container_name: minecraft-skin-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-skin_server}
    # 注意：建表由应用启动时的 SetupService 自动完成（会执行全部迁移）。
    # 这里不再挂载 001-init-postgres.sql 到 docker-entrypoint-initdb.d，
    # 否则只会建到 001 的旧 schema（缺 012/013 等），造成 schema 不一致。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skin-network

  redis:
    image: redis:7-alpine
    container_name: minecraft-skin-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - skin-network

volumes:
  postgres_data:
  redis_data:

networks:
  skin-network:
    driver: bridge
