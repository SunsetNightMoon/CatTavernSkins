<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Skin3D 隔离测试</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #fff;
    }
    .stage {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      /* 灰白棋盘格 */
      background-image:
        linear-gradient(45deg, #c0c0c0 25%, transparent 25%),
        linear-gradient(-45deg, #c0c0c0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #c0c0c0 75%),
        linear-gradient(-45deg, transparent 75%, #c0c0c0 75%);
      background-size: 20px 20px;
      background-color: #f0f0f0;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls button {
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
      background: #e5e7eb;
      color: #333;
      transition: all .15s;
    }
    .controls button.active {
      background: #4f46e5;
      color: #fff;
    }
    .info {
      margin-top: 12px;
      font-size: 12px;
      color: #8899aa;
    }
  </style>
</head>
<body>
  <h2>skinview3d 透明背景测试</h2>
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button id="btnRotate">↻ 旋转</button>
    <button id="btnWave">✋ 摆臂</button>
    <button id="btnIdle" class="active">待机</button>
    <button id="btnWalk">行走</button>
    <button id="btnRun">奔跑</button>
    <button id="btnReset">复位</button>
    <button id="btnModel">切换模型 (Steve/Alex)</button>
  </div>
  <div class="info" id="info">loading...</div>

  <script type="module">
    import { SkinViewer, IdleAnimation, WalkingAnimation, RunningAnimation } from 'https://unpkg.com/skinview3d@3.4.2/bundles/skinview3d.bundle.js'

    const stage = document.getElementById('stage')
    const info = document.getElementById('info')

    // 创建 canvas 并预先开启 alpha
    const canvas = document.createElement('canvas')
    canvas.width = 400
    canvas.height = 400
    stage.appendChild(canvas)

    const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false })
      || canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false })
    info.textContent = 'WebGL alpha: ' + (gl.getContextAttributes().alpha ? 'true' : 'false')

    let currentModel = 'default'
    const viewer = new SkinViewer({
      canvas,
      width: 400,
      height: 400,
      skin: '/steve.png',
      model: currentModel,
      enableControls: true,
      autoRotate: true,
      autoRotateSpeed: 1.5,
    })

    viewer.renderer.setClearColor(0x000000, 0)
    viewer.animation = new IdleAnimation()

    // 按钮事件
    document.getElementById('btnRotate').addEventListener('click', () => {
      viewer.autoRotate = !viewer.autoRotate
      document.getElementById('btnRotate').classList.toggle('active', viewer.autoRotate)
    })

    document.getElementById('btnWave').addEventListener('click', () => {
      if (!viewer.animation) return
      const anim = viewer.animation
      const id = anim.addAnimation((player, progress) => {
        if (progress < 1.2) {
          player.skin.rightArm.rotation.z = Math.sin(progress * 8) * 0.5
        } else {
          player.skin.rightArm.rotation.z = 0
        }
      })
      setTimeout(() => anim.removeAnimation(id), 1200)
    })

    const setAnim = (mode) => {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'))
      if (mode === 'idle') {
        viewer.animation = new IdleAnimation()
        document.getElementById('btnIdle').classList.add('active')
      } else if (mode === 'walk') {
        viewer.animation = new WalkingAnimation()
        document.getElementById('btnWalk').classList.add('active')
      } else if (mode === 'run') {
        viewer.animation = new RunningAnimation()
        document.getElementById('btnRun').classList.add('active')
      }
    }

    document.getElementById('btnIdle').addEventListener('click', () => setAnim('idle'))
    document.getElementById('btnWalk').addEventListener('click', () => setAnim('walk'))
    document.getElementById('btnRun').addEventListener('click', () => setAnim('run'))

    document.getElementById('btnReset').addEventListener('click', () => {
      viewer.playerWrapper.rotation.y = 0
      viewer.resetCameraPose()
    })

    document.getElementById('btnModel').addEventListener('click', () => {
      currentModel = currentModel === 'default' ? 'slim' : 'default'
      viewer.loadSkin('/steve.png', { model: currentModel })
      info.textContent = '当前模型: ' + currentModel
    })
  </script>
</body>
</html>
